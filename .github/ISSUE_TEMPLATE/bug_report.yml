name: Bug report
description: Something in Workspace insight is wrong
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the DSH version and profile so I can reproduce it.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: From the page footer or `dsh --version`
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile name
      placeholder: web / desktop
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Which view
      options:
        - Overview
        - Month
        - Timeline
        - Install / activation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what you saw, and any warning banner text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / Host log
      description: Browser console errors (`[workspace-insight]`) and any Host log line
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I hard-refreshed the page (Ctrl/Cmd + Shift + R)
          required: true
        - label: The plugin is enabled in Settings → Plugins
          required: true
